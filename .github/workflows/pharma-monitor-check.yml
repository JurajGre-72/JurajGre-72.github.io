name: Regulatory monitor – check

# Runs the monitor on a throw-away copy for pull requests, so changes are tested against the
# live sources from GitHub's servers without committing data or sending notifications.
on:
  pull_request:
    paths: ["pharma-monitor/**", ".github/workflows/pharma-monitor*.yml"]
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile
        run: python3 -m py_compile pharma-monitor/*.py
      - name: Unit tests (website trackers, no network)
        run: python3 -m unittest discover -s pharma-monitor/tests -p 'test_*.py' -v
      - name: Install the Claude library
        run: python3 -m pip install --quiet "anthropic==2.14.0"
      - name: Run all sources on a copy
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # if set: explain just 2 items, as a live test
        run: |
          cp -r pharma-monitor "$RUNNER_TEMP/pm"
          python3 "$RUNNER_TEMP/pm/monitor.py" --notify-out "$RUNNER_TEMP/digest.md" --explain-limit 2
          python3 - "$RUNNER_TEMP/pm/data/items.json" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          print("\nSource status:")
          for k, s in d["sources"].items():
              print(f"  {'OK ' if s['ok'] else 'ERR'} {k:14} new={s['new']:<4} {s.get('error') or ''}")
          PY
          if [ -s "$RUNNER_TEMP/digest.md" ]; then echo; echo "Digest that would be sent:"; cat "$RUNNER_TEMP/digest.md"; fi
      - name: Watched pages are stable (a second read right away must report no change)
        run: |
          before=$(python3 -c "import json;print(sum(i['source']=='sdp' for i in json.load(open('$RUNNER_TEMP/pm/data/items.json'))['items']))")
          python3 "$RUNNER_TEMP/pm/monitor.py" --sources sdp
          python3 - "$RUNNER_TEMP/pm/data/items.json" "$before" <<'PY'
          import json, sys
          items = [i for i in json.load(open(sys.argv[1]))["items"] if i["source"] == "sdp"]
          noise = items[: len(items) - int(sys.argv[2])] if len(items) > int(sys.argv[2]) else []
          for i in noise:
              print(f"::error::{i['title']} changed between two reads seconds apart (changing content): {i['summary'][:300]}")
          sys.exit(1 if noise else 0)
          PY

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PW_CHANNEL: chrome          # use the Google Chrome that is preinstalled on the runner
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright (library only)
        run: npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/pw" playwright@1.56.1
      - name: Click through every control of the dashboard
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" node pharma-monitor/tests/dashboard.test.mjs
      - name: Same test against the published site
        if: github.event_name == 'workflow_dispatch'
        run: NODE_PATH="$RUNNER_TEMP/pw/node_modules" DASHBOARD_URL=https://jurajgre-72.github.io/pharma-monitor/ node pharma-monitor/tests/dashboard.test.mjs
