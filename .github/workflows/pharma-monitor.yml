name: Regulatory monitor

on:
  schedule:
    # Backup only: a Claude scheduled task starts the check every 4 hours (at about :03 past 0, 4, 8, 12, 16, 20 UTC).
    # GitHub's own schedule is best-effort and often late, so it skips itself if a check ran in the last 3 hours.
    - cron: "41 */4 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Comma-separated sources (empty = all): slovlex,sukl,sukl_recall,mzsr,uskvbl"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  actions: read   # the backup schedule looks at when the last check ran

concurrency:
  group: pharma-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Skip if a check ran in the last 3 hours (backup schedule only)
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/pharma-monitor.yml/runs?status=success&per_page=1" \
                 -q '.workflow_runs[0].run_started_at // empty')
          if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 10800 ]; then
            echo "A check already ran at $last – skipping this backup run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - name: Install the Claude library (for plain-language explanations)
        if: steps.guard.outputs.skip != 'true'
        run: python3 -m pip install --quiet "anthropic==2.14.0"

      - name: Check Slovak sources
        id: check
        if: steps.guard.outputs.skip != 'true'
        env:
          # Optional direct e-mail; leave the secrets unset to rely on GitHub issue notifications.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          # Optional: with this secret Claude writes "About / What changed / For PHARMACOPOLA" for each item.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOURCES: ${{ inputs.sources }}
        run: |
          args=(--notify-out "$RUNNER_TEMP/digest.md")
          if [ -n "$SOURCES" ]; then args+=(--sources "$SOURCES"); fi
          python3 pharma-monitor/monitor.py "${args[@]}"

      - name: Save results
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pharma-monitor/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Regulatory monitor: update data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      # One notification per check (GitHub e-mails it; the GitHub mobile app shows it as a push notification):
      # new items -> a new "regulatory-update" issue; nothing new or a failed check -> a comment on the check-log issue.
      - name: Notify that the check is done
        if: always() && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          digest="$RUNNER_TEMP/digest.md"
          if [ "$CHECK_OUTCOME" = "success" ] && [ -s "$digest" ]; then
            gh label create regulatory-update --color C2362B --description "New Slovak regulatory item" 2>/dev/null || true
            tail -n +2 "$digest" > "$RUNNER_TEMP/body.md"
            gh issue create --title "$(head -n 1 "$digest")" --body-file "$RUNNER_TEMP/body.md" --label regulatory-update
            exit 0
          fi
          python3 pharma-monitor/check_report.py "$CHECK_OUTCOME" "$RUN_URL" > "$RUNNER_TEMP/report.md"
          gh label create monitor-log --color 00A78F --description "One comment per finished check" 2>/dev/null || true
          log=$(gh issue list --label monitor-log --state open --limit 1 --json number -q '.[0].number // empty')
          if [ -z "$log" ]; then
            log=$(gh issue create --title "Regulatory monitor – check log" --label monitor-log \
                  --body "Every finished check that found nothing new is reported here (new items get their own issue)." | grep -o '[0-9]*$')
          fi
          gh issue comment "$log" --body-file "$RUNNER_TEMP/report.md"
