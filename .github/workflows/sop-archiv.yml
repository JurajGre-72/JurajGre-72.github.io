name: SOP Archiv

# Tests the app and builds the installers (Windows, macOS, Linux).
# Downloads: open the workflow run → "Artifacts". Pushing a tag sop-archiv-vX.Y.Z also publishes a GitHub Release.

on:
  push:
    branches: ['**']
    paths: ['sop-archiv/**', '.github/workflows/sop-archiv.yml']
    tags: ['sop-archiv-v*']
  pull_request:
    paths: ['sop-archiv/**', '.github/workflows/sop-archiv.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

defaults:
  run:
    working-directory: sop-archiv

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sop-archiv/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Libraries Electron needs on a headless runner
        run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libnss3 libasound2t64
      - name: End-to-end test (real Electron app)
        run: xvfb-run -a -s "-screen 0 1440x900x24" node test/e2e/run.js e2e-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-linux
          path: sop-archiv/e2e-screenshots
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
            files: sop-archiv/dist/*.exe
          - name: macOS
            os: macos-latest
            target: --mac
            files: sop-archiv/dist/*.dmg
          - name: Linux
            os: ubuntu-latest
            target: --linux
            files: sop-archiv/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sop-archiv/package-lock.json
      - run: npm ci
      - name: Unit tests on Windows
        if: runner.os == 'Windows'
        run: npm test
      - name: End-to-end test on Windows
        if: runner.os == 'Windows'
        run: node test/e2e/run.js e2e-screenshots
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: e2e-screenshots-windows
          path: sop-archiv/e2e-screenshots
          if-no-files-found: ignore
      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: SOP-Archiv-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/sop-archiv-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SOP-Archiv-*
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: SOP Archív ${{ github.ref_name }}
          files: artifacts/*
