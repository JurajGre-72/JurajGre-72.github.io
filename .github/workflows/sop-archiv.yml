name: SOP Archiv

# Tests the app and builds the installers (Windows, macOS, Linux).
# Downloads: open the workflow run → "Artifacts". A version number (package.json) that has no GitHub
# Release yet is published as one once everything passed (see the release job); the app updates from there.

on:
  push:
    branches: ['**']
    paths: ['sop-archiv/**', '.github/workflows/sop-archiv.yml']
    tags: ['sop-archiv-v*']
  pull_request:
    paths: ['sop-archiv/**', '.github/workflows/sop-archiv.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

defaults:
  run:
    working-directory: sop-archiv

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sop-archiv/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Libraries Electron needs on a headless runner
        run: sudo apt-get update && sudo apt-get install -y xvfb libgbm1 libnss3 libasound2t64
      - name: End-to-end test (real Electron app)
        run: xvfb-run -a -s "-screen 0 1440x900x24" node test/e2e/run.js e2e-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots-linux
          path: sop-archiv/e2e-screenshots
          if-no-files-found: ignore

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
            files: sop-archiv/dist/*.exe
          - name: macOS
            os: macos-latest
            target: --mac
            files: sop-archiv/dist/*.dmg
          - name: Linux
            os: ubuntu-latest
            target: --linux
            files: sop-archiv/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sop-archiv/package-lock.json
      - run: npm ci
      - name: Unit tests on Windows
        if: runner.os == 'Windows'
        run: npm test
      - name: End-to-end test on Windows
        if: runner.os == 'Windows'
        run: node test/e2e/run.js e2e-screenshots
      # The same test on the packaged app (what users install): the same files, sealed app.asar and fuses,
      # only marked as a test build so the test can drive it. The real build refuses that (checked below).
      - name: End-to-end test on the packaged Windows app
        if: runner.os == 'Windows'
        run: |
          npx electron-builder --win dir --publish never '-c.electronFuses.enableNodeCliInspectArguments=true' '-c.extraMetadata.soparchivTestBuild=true'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SOP_ARCHIV_EXE = (Resolve-Path 'dist/win-unpacked/SOP Archiv.exe').Path
          node test/e2e/run.js e2e-screenshots/packaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # macOS: the whole end-to-end test on the packaged Mac app (Apple silicon), the same way.
      - name: End-to-end test on the packaged Mac app
        if: runner.os == 'macOS'
        run: |
          npx electron-builder --mac dir --arm64 --publish never '-c.electronFuses.enableNodeCliInspectArguments=true' '-c.extraMetadata.soparchivTestBuild=true'
          SOP_ARCHIV_EXE="$PWD/dist/mac-arm64/SOP Archiv.app/Contents/MacOS/SOP Archiv" node test/e2e/run.js e2e-screenshots/packaged-mac
          rm -rf dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux' && always()
        with:
          name: e2e-screenshots-${{ matrix.name }}
          path: sop-archiv/e2e-screenshots
          if-no-files-found: ignore
      - name: Build installer
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: The installed app refuses a debugging mode
        if: runner.os == 'Windows'
        run: |
          $p = Start-Process -FilePath (Resolve-Path 'dist/win-unpacked/SOP Archiv.exe').Path -ArgumentList '--inspect=0' -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'The installed app started with a debugger attached' }
          if ($p.ExitCode -ne 1) { throw "Unexpected exit code $($p.ExitCode)" }
          'Refused, as it should.'
      # No Apple certificate: the Mac app carries an ad-hoc signature (without one, Macs with Apple silicon
      # refuse to start it). Checked here, and that the real build refuses a debugging mode.
      - name: The Mac app is signed (ad hoc) and refuses a debugging mode
        if: runner.os == 'macOS'
        run: |
          for app in "dist/mac-arm64/SOP Archiv.app" "dist/mac/SOP Archiv.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done
          set +e
          "dist/mac-arm64/SOP Archiv.app/Contents/MacOS/SOP Archiv" --inspect=0 > refuse.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          if kill -0 $pid 2>/dev/null; then kill $pid; echo 'The Mac app started with a debugger attached'; exit 1; fi
          wait $pid
          code=$?
          cat refuse.log
          test $code -eq 1 && grep -q 'debugging mode' refuse.log && echo 'Refused, as it should.'
      - name: One-click update on a Mac (real disk image, swap after quitting)
        if: runner.os == 'macOS'
        run: node test/mac-selfupdate.js
      - name: The Windows installer installs and updates without questions
        if: runner.os == 'Windows'
        run: |
          $setup = (Get-ChildItem dist -Filter '*-Setup.exe' | Select-Object -First 1).FullName
          foreach ($round in 1..2) {
            $p = Start-Process -FilePath $setup -ArgumentList '/S' -PassThru
            $null = $p.Handle
            if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'The installer did not finish' }
            if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode) (round $round)" }
          }
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter 'SOP Archiv.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'Not installed' }
          "Installed: $($exe.FullName)"
          $q = Start-Process -FilePath $exe.FullName -ArgumentList '--inspect=0' -PassThru
          $null = $q.Handle
          if (-not $q.WaitForExit(60000)) { $q.Kill(); throw 'The installed app started with a debugger attached' }
          if ($q.ExitCode -ne 1) { throw "Unexpected exit code $($q.ExitCode)" }
          'Installed, updated in place, and the installed app runs.'
      - uses: actions/upload-artifact@v4
        with:
          name: SOP-Archiv-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    name: Publish release
    # A version number (package.json) not published yet is published once, after every test and build
    # passed, with its fingerprints (SHA256SUMS.txt) and what is new (NOVINKY.md). The app downloads its
    # updates from here. Later pushes with the same number publish nothing.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version, and whether it is published already
        id: v
        env:
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          case "$REF" in
            refs/tags/sop-archiv-v*) if [ "${REF#refs/tags/sop-archiv-v}" != "$v" ]; then echo "The tag does not match the app version $v"; exit 1; fi ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "sop-archiv-v$v" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "sop-archiv-v$v is published already: nothing to do."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: What is new (NOVINKY.md)
        if: steps.v.outputs.new == 'true'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          awk -v head="## $V" '$0 == head { f = 1; next } /^## / { if (f) exit } f' NOVINKY.md | sed '/./,$!d' > ../release-notes.md
          if ! grep -q '[^[:space:]]' ../release-notes.md; then echo "NOVINKY.md has no section '## $V'"; exit 1; fi
          cat >> ../release-notes.md <<'TXT'

          Ktorý súbor / Which file:
          - Windows: SOP-Archiv-<verzia>-Setup.exe (inštalátor) alebo -portable.exe
          - Mac s čipom Apple M1–M4: -mac-arm64.dmg; Mac s procesorom Intel: -mac-x64.dmg
          Aktualizácia z aplikácie: Nastavenia → O aplikácii → Skontrolovať aktualizácie → Stiahnuť a nainštalovať.
          Program neobsahuje žiadne dokumenty – SOP a OS zostávajú v počítači alebo na firemnom serveri.
          TXT
          cat ../release-notes.md
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.new == 'true'
        with:
          pattern: SOP-Archiv-*
          path: artifacts
          merge-multiple: true
      - name: Fingerprints of the files
        if: steps.v.outputs.new == 'true'
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.new == 'true'
        with:
          tag_name: sop-archiv-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: SOP Archív ${{ steps.v.outputs.version }}
          body_path: release-notes.md
          files: artifacts/*
